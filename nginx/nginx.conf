worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    resolver 127.0.0.11;

    # 请求速率限制：每个IP每秒5次请求，突发10次
    limit_req_zone $binary_remote_addr zone=api_limit_zone:10m rate=5r/s;

    upstream api_backend  { server fastapi-app:8000; }
    upstream static_front { server static-site:80;   }

    # 🔁 HTTP强制跳转到HTTPS（已注释）
